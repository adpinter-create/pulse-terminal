# ── Government economic data (FRED) ─────────────────────────────────────────
# ids: first working ID wins (fallbacks for series BLS occasionally renames)
      heatmap: false
      watchlist: false
      monitor: true
kpis:  # Hero tiles in order. Types: ticker, macro_yoy, fda_shortages, fda_class1, breadth
  - {type: "ticker", symbol: "^GSPC", label: "S&P 500"}
  - {type: "ticker", symbol: "^NDX", label: "Nasdaq 100"}
  - {type: "ticker", symbol: "^TNX", label: "10-year yield"}
  - {type: "ticker", symbol: "^VIX", label: "Volatility (VIX)", tone: "inverse"}
  - {type: "ticker", symbol: "CL=F", label: "WTI crude", tone: "cost"}
  - {type: "ticker", symbol: "GC=F", label: "Gold"}
  - {type: "ticker", symbol: "BTC-USD", label: "Bitcoin"}
  - {type: "ticker", symbol: "DX-Y.NYB", label: "Dollar index"}
  - {type: "ticker", symbol: "XLV", label: "Health care sector"}
  - {type: "macro_yoy", key: "cpi_rx", label: "Rx and medical goods", tone: "cost"}
  - {type: "fda_shortages", label: "Drugs in shortage"}
  - {type: "fda_class1", label: "Class I recalls"}
fred:
  start: "2016-01-01"
  series:
    - {key: "wti", short: "Crude (WTI)", ids: ["DCOILWTICO"], title: "WTI crude, spot", units: "$/bbl", fmt: "usd"}
    - {key: "brent", short: "Brent", ids: ["DCOILBRENTEU"], title: "Brent crude, spot", units: "$/bbl", fmt: "usd"}
    - {key: "diesel", short: "Diesel", ids: ["GASDESW"], title: "US diesel, retail", units: "$/gal", fmt: "usd3"}
    - {key: "gasoline", short: "Gasoline", ids: ["GASREGW"], title: "US gasoline, retail", units: "$/gal", fmt: "usd3"}
    - {key: "natgas", short: "Natural gas", ids: ["DHHNGSP"], title: "Henry Hub natural gas", units: "$/MMBtu", fmt: "usd"}
    - {key: "ppi_freight", short: "Truck freight PPI", ids: ["PCU484484", "PCU484121484121"], title: "Truck freight producer prices", units: "index", fmt: "idx"}
    - {key: "ppi_pharma", short: "Drug mfg PPI", ids: ["PCU325412325412"], title: "Drug manufacturing producer prices", units: "index", fmt: "idx"}
    - {key: "ppi_rx_retail", short: "Pharmacy margin PPI", ids: ["PCU4461104461101"], title: "Pharmacy Rx retailing margins (PPI)", units: "index", fmt: "idx"}
    - {key: "cpi_rx", short: "Rx and medical goods CPI", ids: ["CUSR0000SAM1", "CUUR0000SAM1"], title: "Consumer prices: medical goods (mostly prescription drugs)", units: "index", fmt: "idx"}
    - {key: "cpi_medical", short: "Medical CPI", ids: ["CPIMEDSL"], title: "Medical care consumer prices", units: "index", fmt: "idx"}
    - {key: "cpi_all", short: "All-items CPI", ids: ["CPIAUCSL"], title: "All-items consumer prices", units: "index", fmt: "idx"}
    - {key: "retail_hpc", short: "Health store sales", ids: ["RSHPCS"], title: "Health and personal care store sales", units: "$M", fmt: "musd"}
    - {key: "pharm_sales", short: "Pharmacy sales", ids: ["MRTSSM44611USN"], title: "Pharmacy and drug store retail sales", units: "$M", fmt: "musd"}
    - {key: "ust10", short: "10-yr Treasury", ids: ["DGS10"], title: "10-year Treasury yield", units: "%", fmt: "pct"}
    - {key: "fedfunds", short: "Fed funds", ids: ["DFF"], title: "Fed funds rate", units: "%", fmt: "pct"}
    - {key: "unrate", ids: ["UNRATE"], short: "Unemployment", title: "Unemployment rate", units: "%", fmt: "pct"}
    - {key: "t10y2y", ids: ["T10Y2Y"], short: "10y minus 2y", title: "Yield curve: 10-year minus 2-year", units: "%", fmt: "pct"}
    - {key: "hy_spread", ids: ["BAMLH0A0HYM2"], short: "High-yield spread", title: "High-yield corporate bond spread", units: "%", fmt: "pct"}
    - {key: "freight_tsi", ids: ["TSIFRGHT"], short: "Freight index", title: "Freight transportation services index", units: "index", fmt: "idx"}
    - {key: "indpro", ids: ["INDPRO"], short: "Industrial output", title: "Industrial production index", units: "index", fmt: "idx"}

# How input costs flow toward the pharmacy counter (shown in this order)
cost_chain: ["wti", "diesel", "ppi_freight", "ppi_pharma", "ppi_rx_retail", "cpi_rx"]
# Series compared in the correlation matrix (year-over-year % changes, monthly)
correlation_set: ["wti", "diesel", "natgas", "ppi_freight", "ppi_pharma", "ppi_rx_retail", "cpi_rx", "cpi_medical", "cpi_all"]
correlation_window_months: 60
# Does the first series lead the second? Tested at 0–12 month lags.
lead_lag_pairs:
  - ["wti", "ppi_freight"]
  - ["diesel", "ppi_freight"]
  - ["wti", "ppi_pharma"]
  - ["ppi_freight", "cpi_rx"]
  - ["ppi_pharma", "cpi_rx"]
  - ["ppi_rx_retail", "cpi_rx"]

# ── FDA (openFDA, no key required; OPENFDA_API_KEY raises limits) ───────────
fda:
  recall_lookback_days: 30
  recall_trend_weeks: 26

# ── News ─────────────────────────────────────────────────────────────────────
news:
  desks:  # News desks. Every feed and search belongs to one; the News tab filters by desk
    - {id: "markets", name: "Markets"}
    - {id: "tech", name: "Tech"}
    - {id: "supply", name: "Supply chain"}
    - {id: "world", name: "World and policy"}
    - {id: "health", name: "Health and pharmacy"}
