# ─────────────────────────────────────────────────────────────────────────────
# Pulse Terminal configuration. Everything the dashboard tracks lives here.
# Edit, commit, and the next scheduled run picks it up. No code changes needed.
# ─────────────────────────────────────────────────────────────────────────────

site:
  title: "Pulse Terminal"
  subtitle: "Markets, tech, supply chain and pharmacy intelligence"
  author: "Andrei Pinter"
  timezone: "America/Chicago"      # display timezone for all timestamps
  theme: "terminal"                # auto | light | dark | terminal (visitors can switch)
  poll_minutes: 3                  # how often an open page checks for fresh data
  refresh_note: "Every 15 min in market hours"   # shown on the label; match your workflow schedule
  public_url: ""                   # set to your address once live, e.g. https://pulse.andreipinter.com
                                   # (fills in the embed snippet; leave blank until then)

# ── Markets ──────────────────────────────────────────────────────────────────
# weight: tile size in the heatmap (1 small, 2 medium, 3 large)
# aliases: names that link a headline to this company (whole-word, case-insensitive)
# stooq: symbol override for the Stooq fallback provider
markets:
  history_period: "2y"
  providers: ["yfinance", "stooq", "tiingo"]   # tried in order; tiingo needs TIINGO_API_KEY
  benchmark: "SPY"
  sector_etf: "XLV"
  earnings_calendar: true
  segments:
    - id: "indices"
      name: "Major indices"
      kind: "market"
      monitor: true
      heatmap: false
      watchlist: false
      tickers:
        - {symbol: "^GSPC", name: "S&P 500", short: "SPX", unit: "idx", stooq: "^spx", weight: 2, aliases: []}
        - {symbol: "^NDX", name: "Nasdaq 100", short: "NDX", unit: "idx", stooq: "^ndx", weight: 2, aliases: []}
        - {symbol: "^DJI", name: "Dow Jones Industrial Average", short: "INDU", unit: "idx", stooq: "^dji", weight: 2, aliases: []}
        - {symbol: "^RUT", name: "Russell 2000", short: "RTY", unit: "idx", note: "US small caps", aliases: []}
        - {symbol: "^VIX", name: "Volatility index (VIX)", short: "VIX", unit: "idx", note: "Expected S&P 500 volatility; higher means more fear", aliases: []}
        - {symbol: "^STOXX50E", name: "Euro Stoxx 50", short: "SX5E", unit: "idx", aliases: []}
        - {symbol: "^FTSE", name: "FTSE 100", short: "UKX", unit: "idx", stooq: "^ukx", aliases: []}
        - {symbol: "^N225", name: "Nikkei 225", short: "NKY", unit: "idx", stooq: "^nkx", aliases: []}
        - {symbol: "^HSI", name: "Hang Seng", short: "HSI", unit: "idx", stooq: "^hsi", aliases: []}
    - id: "rates_fx"
      name: "Rates and currencies"
      kind: "market"
      monitor: true
      heatmap: false
      watchlist: false
      tickers:
        - {symbol: "^IRX", name: "13-week T-bill yield", short: "US3M", unit: "%", aliases: []}
        - {symbol: "^FVX", name: "5-year Treasury yield", short: "US5Y", unit: "%", aliases: []}
        - {symbol: "^TNX", name: "10-year Treasury yield", short: "US10Y", unit: "%", aliases: []}
        - {symbol: "^TYX", name: "30-year Treasury yield", short: "US30Y", unit: "%", aliases: []}
        - {symbol: "DX-Y.NYB", name: "US dollar index", short: "DXY", unit: "idx", aliases: []}
        - {symbol: "EURUSD=X", name: "Euro in dollars", short: "EURUSD", unit: "fx", stooq: "eurusd", aliases: []}
        - {symbol: "USDJPY=X", name: "Dollar in yen", short: "USDJPY", unit: "fx", stooq: "usdjpy", aliases: []}
        - {symbol: "GBPUSD=X", name: "Pound in dollars", short: "GBPUSD", unit: "fx", stooq: "gbpusd", aliases: []}
        - {symbol: "USDCNY=X", name: "Dollar in yuan", short: "USDCNY", unit: "fx", stooq: "usdcny", aliases: []}
    - id: "crypto"
      name: "Crypto"
      kind: "market"
      monitor: true
      heatmap: false
      watchlist: false
      tickers:
        - {symbol: "BTC-USD", name: "Bitcoin", short: "BTC", stooq: "btcusd", weight: 2, aliases: []}
        - {symbol: "ETH-USD", name: "Ether", short: "ETH", stooq: "ethusd", aliases: []}
